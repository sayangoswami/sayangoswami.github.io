        const anim = p.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );
        anim.onfinish = () => {
          p.style.strokeDashoffset = 0;
          if (++done === paths.length) resolve();
        };
      });
    });
  }

  function fadeInEl(g, duration) {
    return new Promise(resolve => {
      g.style.opacity = 0;
      const anim = g.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => { g.style.opacity = 1; resolve(); };
    });
  }

  function fadeOutEl(g, duration) {
    return new Promise(resolve => {
      const anim = g.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => { g.style.opacity = 0; resolve(); };
    });
  }

  function indicateEl(g, color, duration) {
    return new Promise(resolve => {
      const els = [...g.querySelectorAll('path,rect,ellipse,polygon')];
      const origFills = els.map(el => el.getAttribute('fill'));
      els.forEach(el => el.setAttribute('fill', color));
      setTimeout(() => {
        els.forEach((el, i) => el.setAttribute('fill', origFills[i]));
        resolve();
      }, duration);
    });
  }

  function swapLabels(g1, g2, duration) {
    // Find the label <text> element in each cell group (direct child, not inside Rough.js paths)
    const lbl1 = [...g1.children].find(el => el.tagName.toLowerCase() === 'text');
    const lbl2 = [...g2.children].find(el => el.tagName.toLowerCase() === 'text');
    if (!lbl1 || !lbl2) return Promise.resolve();

    const x1 = parseFloat(lbl1.getAttribute('x') || 0);
    const y1 = parseFloat(lbl1.getAttribute('y') || 0);
    const x2 = parseFloat(lbl2.getAttribute('x') || 0);
    const y2 = parseFloat(lbl2.getAttribute('y') || 0);
    const dx = x2 - x1;
    const arcH = Math.min(Math.abs(dx) * 0.4, 60);

    // Clone labels to SVG root so they float above everything
    const fly1 = lbl1.cloneNode(true);
    const fly2 = lbl2.cloneNode(true);
    svgEl.appendChild(fly1);
    svgEl.appendChild(fly2);

    // Hide originals during flight
    lbl1.style.opacity = '0';
    lbl2.style.opacity = '0';

    return Promise.all([
      new Promise(res => {
        const a = fly1.animate(
          [{ transform: 'translate(0,0)' },
           { transform: `translate(${dx/2}px,${-arcH}px)` },
           { transform: `translate(${dx}px,0px)` }],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );
        a.onfinish = () => { fly1.remove(); res(); };
      }),
      new Promise(res => {
        const a = fly2.animate(
          [{ transform: 'translate(0,0)' },
           { transform: `translate(${-dx/2}px,${arcH}px)` },
           { transform: `translate(${-dx}px,0px)` }],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );
        a.onfinish = () => { fly2.remove(); res(); };
      }),
    ]);
  }

  function translateEl(g, dx, dy, duration) {
    return new Promise(resolve => {
      const anim = g.animate(
        [{ transform: 'translate(0px,0px)' },
         { transform: `translate(${dx}px,${dy}px)` }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => resolve();
    });
  }

  function fillChangeEl(g, toColor, duration) {
    const els = [...g.querySelectorAll('path,rect,polygon')].filter(el => {
      const f = el.getAttribute('fill');
      return f && f !== 'none';
    });
    if (!els.length) return Promise.resolve();
    return Promise.all(els.map(el => new Promise(resolve => {
      const from = el.getAttribute('fill') || 'transparent';
      const anim = el.animate(
        [{ fill: from }, { fill: toColor }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => { el.setAttribute('fill', toColor); resolve(); };
    })));
  }

  // ── Main runtime ─────────────────────────────────────────────────────────

  let svgEl, rc;
  let currentStep = -1;   // -1 = blank (before first step)
  let isPlaying   = false;
  let playTimer   = null;
  // Embed mode (set by render_html(chrome="embed")): no player chrome, opens on
  // step 1, and a host page (e.g. a reveal.js deck) drives it via postMessage.
  const EMBED = !!window.PYXCD_EMBED;

  function findGroup(mobId) {
    return svgEl.querySelector(`[data-mob-id="${mobId}"]`);
  }

  function clearScene() {
    const toRemove = [...svgEl.querySelectorAll('[data-mob-id]')];
    toRemove.forEach(el => el.remove());
  }

  function renderSnapshot(snapshot) {
    clearScene();
    snapshot.forEach(spec => renderSpec(rc, svgEl, spec));
    // After render, show all paths fully drawn (dash = 0)
    svgEl.querySelectorAll('[data-mob-id] path').forEach(p => {
      p.style.strokeDashoffset = 0;
    });
  }

  async function runEffects(step) {
    const effects = step.effects || [];
    const promises = [];

    for (const eff of effects) {
      if (eff.effect === 'succession') continue;
      const dur = eff.duration || step.duration || 500;

      // Swap needs two groups
      if (eff.effect === 'swap') {
        const g1 = findGroup(eff.mob_id_1);
        const g2 = findGroup(eff.mob_id_2);
        if (g1 && g2) promises.push(swapLabels(g1, g2, dur));
        continue;
      }

      const g = findGroup(eff.mob_id);
      if (!g) continue;
      if (eff.effect === 'draw_on')          promises.push(drawOn(g, dur));
      else if (eff.effect === 'fade_in')     promises.push(fadeInEl(g, dur));
      else if (eff.effect === 'fade_out')    promises.push(fadeOutEl(g, dur));
      else if (eff.effect === 'indicate')    promises.push(indicateEl(g, eff.color, dur));
      else if (eff.effect === 'fill_change') promises.push(fillChangeEl(g, eff.to, dur));
      else if (eff.effect === 'translate')   promises.push(translateEl(g, eff.dx, eff.dy, dur));
    }

    await Promise.all(promises);
  }

  async function goToStep(idx, animate) {
    if (idx < 0 || idx >= TIMELINE.length) return;
    const step = TIMELINE[idx];
    currentStep = idx;

    // Render snapshot first (full scene for this step, paths will draw on)
    if (animate) {
      renderSnapshotForAnimation(step);
      await runEffects(step);
      // Reconcile DOM with snapshot: updates labels/fills on existing mobs that
      // changed (e.g. after swap). Seeds are stable so Rough.js re-renders identically.
      renderSnapshot(step.snapshot);
    } else {
      renderSnapshot(step.snapshot);
    }

    updateUI();
  }

  function renderSnapshotForAnimation(step) {
    // Figures out which mob IDs are new vs already on screen
    const existing = new Set([...svgEl.querySelectorAll('[data-mob-id]')]
      .map(g => g.getAttribute('data-mob-id')));
    const incoming = new Set((step.snapshot || []).map(s => s.id));

    // Remove mobs that are no longer in the snapshot
    [...svgEl.querySelectorAll('[data-mob-id]')].forEach(g => {
      if (!incoming.has(g.getAttribute('data-mob-id'))) g.remove();
    });

    // Add new mobs
    (step.snapshot || []).forEach(spec => {
      if (!existing.has(spec.id)) {
        renderSpec(rc, svgEl, spec);
      }
    });
  }

  function updateUI() {
    const stepCount = document.getElementById('pyxcd-step-count');
    if (stepCount) stepCount.textContent = `${currentStep + 1} / ${TIMELINE.length}`;
    const stepLabel = document.getElementById('pyxcd-step-label');
    if (stepLabel) {
      const step = currentStep >= 0 ? TIMELINE[currentStep] : null;
      stepLabel.textContent = step
        ? `${currentStep + 1} / ${TIMELINE.length}  ${step.title || ''}`
        : `0 / ${TIMELINE.length}`;
    }
  }

  // ── Controls ─────────────────────────────────────────────────────────────

  // next()/prev() return whether they moved, so a host knows when it's at an end.
  function next() {
    if (currentStep >= TIMELINE.length - 1) return false;
    goToStep(currentStep + 1, true);
    return true;
  }

  function prev() {
    if (currentStep > 0) { goToStep(currentStep - 1, false); return true; }
    if (currentStep === 0 && !EMBED) { clearScene(); currentStep = -1; updateUI(); return true; }
    return false;
  }

  function restart() {
    stopPlay();
    if (EMBED && TIMELINE.length) { goToStep(0, false); return; }
    clearScene();
    currentStep = -1;
    updateUI();
  }

  function startPlay() {
    if (isPlaying) return;
    isPlaying = true;
    async function tick() {
      if (!isPlaying) return;
      if (currentStep >= TIMELINE.length - 1) { stopPlay(); return; }
      await goToStep(currentStep + 1, true);
      const dur = TIMELINE[currentStep].duration || 500;
      playTimer = setTimeout(tick, dur + 100);
    }
    tick();
  }

  function stopPlay() {
    isPlaying = false;
    clearTimeout(playTimer);
  }

  function togglePlay() {
    if (isPlaying) stopPlay(); else startPlay();
  }

  // ── Init ─────────────────────────────────────────────────────────────────

  function init() {
    svgEl = document.getElementById('pyxcd-canvas');
    if (!svgEl) return;
    rc = rough.svg(svgEl);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { stopPlay(); next(); }
      else if (e.key === 'ArrowLeft')  { stopPlay(); prev(); }
      else if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
      else if (e.key === 'r' || e.key === 'R') restart();
    });

    const btnPrev  = document.getElementById('pyxcd-btn-prev');
    const btnNext  = document.getElementById('pyxcd-btn-next');
    const btnPlay  = document.getElementById('pyxcd-btn-play');
    const btnReset = document.getElementById('pyxcd-btn-reset');
    if (btnPrev)  btnPrev.addEventListener('click',  () => { stopPlay(); prev(); });
    if (btnNext)  btnNext.addEventListener('click',  () => { stopPlay(); next(); });
    if (btnPlay)  btnPlay.addEventListener('click',  togglePlay);
    if (btnReset) btnReset.addEventListener('click', restart);

    // Host protocol: {pyxcd: 'next' | 'prev' | 'restart', id} -> reply
    // {pyxcd: 'reply', id, moved}. moved = false means "at the end, your turn".
    // On load (and on {pyxcd: 'ping'}) an embedded player says {pyxcd: 'hello'}
    // so the host knows which iframes are pyxcd animations.
    const hello = target => target.postMessage({ pyxcd: 'hello' }, '*');
    if (window.parent !== window) hello(window.parent);
    window.addEventListener('message', e => {
      const msg = e.data;
      if (!msg || typeof msg.pyxcd !== 'string' || msg.pyxcd === 'reply') return;
      if (msg.pyxcd === 'ping') { if (e.source) hello(e.source); return; }
      stopPlay();
      let moved = false;
      if (msg.pyxcd === 'next') moved = next();
      else if (msg.pyxcd === 'prev') moved = prev();
      else if (msg.pyxcd === 'restart') { restart(); moved = true; }
      if (e.source) e.source.postMessage({ pyxcd: 'reply', id: msg.id, moved }, '*');
    });

    if (EMBED) {
      svgEl.addEventListener('click', () => { stopPlay(); next(); });
      if (TIMELINE.length) { goToStep(0, false); return; }
    }

    updateUI();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
