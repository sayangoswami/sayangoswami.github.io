<title>pyxcd</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    font-family: 'Virgil', 'Comic Sans MS', cursive;
    padding: 16px;
  }
  #pyxcd-wrapper {
    background: #fafaf9;
    border-radius: 12px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    overflow: hidden;
    position: relative;
  }
  #pyxcd-canvas {
    display: block;
    background: #fafaf9;
  }
  #pyxcd-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.06);
    border-top: 1px solid rgba(0,0,0,0.08);
  }
  #pyxcd-controls button {
    background: #3d3d5c;
    color: #eee;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: background 0.15s;
  }
  #pyxcd-controls button:hover { background: #5c5c8a; }
  #pyxcd-step-label {
    flex: 1;
    text-align: center;
    color: #555;
    font-size: 13px;
  }
  #pyxcd-hint {
    margin-top: 10px;
    color: #7070a0;
    font-size: 12px;
  }
</style>
</head>

  // ── Rough.js options per shape ──────────────────────────────────────────
  function roughOpts(spec) {
    return {
      roughness:   spec.roughness  != null ? spec.roughness  : 1.0,
      stroke:      spec.stroke     || '#1e1e1e',
      strokeWidth: spec.stroke_width != null ? spec.stroke_width : 2,
      fill:        (spec.fill && spec.fill !== 'transparent') ? spec.fill : null,
      fillStyle:   'solid',
      seed:        spec.seed || 1,
    };
  }

  // ── Arrowhead polygon ────────────────────────────────────────────────────
  function makeArrowhead(svg, x, y, tx, ty, size) {
    // tx,ty is unit tangent pointing toward the tip
    const angle = Math.atan2(ty, tx);
    const spread = Math.PI / 7;
    const len = size || 14;
    const p1x = x - len * Math.cos(angle - spread);
    const p1y = y - len * Math.sin(angle - spread);
    const p2x = x - len * Math.cos(angle + spread);
    const p2y = y - len * Math.sin(angle + spread);
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', `${x},${y} ${p1x},${p1y} ${p2x},${p2y}`);
    poly.setAttribute('fill', '#1e1e1e');
    poly.style.pointerEvents = 'none';
    return poly;
  }

  // ── Font family map ───────────────────────────────────────────────────────

    2: "Helvetica, Arial, sans-serif",
    3: "'Cascadia Code', 'Fira Code', monospace",

  // ── Render a single mob spec → SVG group ────────────────────────────────
  function renderSpec(rc, svg, spec) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('data-mob-id', spec.id);
    g.style.opacity = spec.opacity != null ? spec.opacity / 100 : 1;

    const opts = roughOpts(spec);
    let node = null;

    if (spec.shape === 'rectangle') {
      node = rc.rectangle(spec.x, spec.y, spec.w, spec.h, opts);
    } else if (spec.shape === 'ellipse') {
      node = rc.ellipse(spec.x + spec.w / 2, spec.y + spec.h / 2, spec.w, spec.h, opts);
    } else if (spec.shape === 'diamond') {
      const cx = spec.x + spec.w / 2, cy = spec.y + spec.h / 2;
      const pts = [[cx, spec.y], [spec.x + spec.w, cy], [cx, spec.y + spec.h], [spec.x, cy]];
      node = rc.polygon(pts, opts);
    } else if (spec.shape === 'line') {
      const pts = spec.points || [];
      if (pts.length >= 2) {
        node = rc.line(pts[0][0], pts[0][1], pts[pts.length-1][0], pts[pts.length-1][1], opts);
      }
    } else if (spec.shape === 'arrow') {
      const pts = spec.points || [];
      if (pts.length >= 2) {
        node = rc.linearPath(pts, opts);
        const last = pts[pts.length - 1];
        const prev = pts[pts.length - 2];
        const tx = last[0] - prev[0], ty = last[1] - prev[1];
        const len = Math.hypot(tx, ty) || 1;
        g.appendChild(makeArrowhead(svg, last[0], last[1], tx/len, ty/len));

          const sl = Math.hypot(stx,sty)||1;
          g.appendChild(makeArrowhead(svg, sf[0], sf[1], stx/sl, sty/sl));

      node = rc.path(spec.d, opts);
      // Arrowheads for curves
      if (spec.end_arrowhead && spec.end_point && spec.end_tangent) {
        g.appendChild(makeArrowhead(svg,
          spec.end_point[0], spec.end_point[1],
          spec.end_tangent[0], spec.end_tangent[1]));
      }
      if (spec.start_arrowhead && spec.start_point && spec.start_tangent) {
        g.appendChild(makeArrowhead(svg,
          spec.start_point[0], spec.start_point[1],
          -spec.start_tangent[0], -spec.start_tangent[1]));

      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', spec.x);
      t.setAttribute('y', spec.y + (spec.h || spec.font_size || 20));
      t.setAttribute('fill', spec.color || spec.stroke || '#1e1e1e');
      t.setAttribute('font-size', spec.font_size || 20);

      // Setup stroke-dashoffset for draw-on animation
      node.querySelectorAll('path').forEach(p => {
        const len = p.getTotalLength ? p.getTotalLength() : 0;
        p.style.strokeDasharray  = len;
        p.style.strokeDashoffset = len;
        p.dataset.pathLen = len;

    if (spec.label) {

      lt.setAttribute('y', ly);

      lt.setAttribute('font-size', spec.font_size || 20);
      lt.setAttribute('font-family', FONTS[spec.font_family] || FONTS[1]);
      lt.textContent = spec.label;
      g.appendChild(lt);
    }

    svg.appendChild(g);
    return g;
  }

  // ── Animation helpers ────────────────────────────────────────────────────

  function drawOn(g, duration) {
    const paths = g.querySelectorAll('path');
    if (!paths.length) { return Promise.resolve(); }
    return new Promise(resolve => {
      let done = 0;
      paths.forEach(p => {
        const len = parseFloat(p.dataset.pathLen || p.getTotalLength());
        p.style.strokeDasharray  = len;
        p.style.strokeDashoffset = len;
        const anim = p.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );
        anim.onfinish = () => {
          p.style.strokeDashoffset = 0;
          if (++done === paths.length) resolve();
        };
      });
    });
  }

  function fadeInEl(g, duration) {
    return new Promise(resolve => {
      g.style.opacity = 0;
      const anim = g.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => { g.style.opacity = 1; resolve(); };
    });
  }

  function fadeOutEl(g, duration) {
    return new Promise(resolve => {
      const anim = g.animate(
        [{ opacity: 1 }, { opacity: 0 }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => { g.style.opacity = 0; resolve(); };
    });
  }

  function indicateEl(g, color, duration) {
    return new Promise(resolve => {
      const els = [...g.querySelectorAll('path,rect,ellipse,polygon')];
      const origFills = els.map(el => el.getAttribute('fill'));
      els.forEach(el => el.setAttribute('fill', color));
      setTimeout(() => {
        els.forEach((el, i) => el.setAttribute('fill', origFills[i]));
        resolve();
      }, duration);
    });
  }

  function swapLabels(g1, g2, duration) {
    // Find the label <text> element in each cell group (direct child, not inside Rough.js paths)
    const lbl1 = [...g1.children].find(el => el.tagName.toLowerCase() === 'text');
    const lbl2 = [...g2.children].find(el => el.tagName.toLowerCase() === 'text');

    const y1 = parseFloat(lbl1.getAttribute('y') || 0);
    const x2 = parseFloat(lbl2.getAttribute('x') || 0);
    const y2 = parseFloat(lbl2.getAttribute('y') || 0);

    const arcH = Math.min(Math.abs(dx) * 0.4, 60);

    const fly1 = lbl1.cloneNode(true);

    svgEl.appendChild(fly2);

    lbl1.style.opacity = '0';
    lbl2.style.opacity = '0';

          [{ transform: 'translate(0,0)' },
           { transform: `translate(${dx/2}px,${-arcH}px)` },
           { transform: `translate(${dx}px,0px)` }],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );
        a.onfinish = () => { fly1.remove(); res(); };
      }),
      new Promise(res => {
        const a = fly2.animate(
          [{ transform: 'translate(0,0)' },
           { transform: `translate(${-dx/2}px,${arcH}px)` },
           { transform: `translate(${-dx}px,0px)` }],
          { duration, easing: 'ease-in-out', fill: 'forwards' }
        );
        a.onfinish = () => { fly2.remove(); res(); };
      }),
    ]);

  function translateEl(g, dx, dy, duration) {
    return new Promise(resolve => {
      const anim = g.animate(
        [{ transform: 'translate(0px,0px)' },
         { transform: `translate(${dx}px,${dy}px)` }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => resolve();
    });
  }

  function fillChangeEl(g, toColor, duration) {
    const els = [...g.querySelectorAll('path,rect,polygon')].filter(el => {
      const f = el.getAttribute('fill');
      return f && f !== 'none';

    if (!els.length) return Promise.resolve();
    return Promise.all(els.map(el => new Promise(resolve => {
      const from = el.getAttribute('fill') || 'transparent';
      const anim = el.animate(
        [{ fill: from }, { fill: toColor }],
        { duration, easing: 'ease-in-out', fill: 'forwards' }
      );
      anim.onfinish = () => { el.setAttribute('fill', toColor); resolve(); };

      // Swap needs two groups

    async function tick() {
      if (!isPlaying) return;
      if (currentStep >= TIMELINE.length - 1) { stopPlay(); return; }
      await goToStep(currentStep + 1, true);
      const dur = TIMELINE[currentStep].duration || 500;
      playTimer = setTimeout(tick, dur + 100);
    }
    tick();
  }

  function stopPlay() {
    isPlaying = false;
    clearTimeout(playTimer);
  }

  function togglePlay() {
    if (isPlaying) stopPlay(); else startPlay();
  }

  // ── Init ─────────────────────────────────────────────────────────────────

  function init() {
    svgEl = document.getElementById('pyxcd-canvas');
    if (!svgEl) return;
    rc = rough.svg(svgEl);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { stopPlay(); next(); }
      else if (e.key === 'ArrowLeft')  { stopPlay(); prev(); }
      else if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
      else if (e.key === 'r' || e.key === 'R') restart();
    });

    const btnPrev  = document.getElementById('pyxcd-btn-prev');
    const btnNext  = document.getElementById('pyxcd-btn-next');
    const btnPlay  = document.getElementById('pyxcd-btn-play');
    const btnReset = document.getElementById('pyxcd-btn-reset');
    if (btnPrev)  btnPrev.addEventListener('click',  () => { stopPlay(); prev(); });
    if (btnNext)  btnNext.addEventListener('click',  () => { stopPlay(); next(); });
    if (btnPlay)  btnPlay.addEventListener('click',  togglePlay);
    if (btnReset) btnReset.addEventListener('click', restart);

    updateUI();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
